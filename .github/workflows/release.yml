name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate calendar version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"

          if [[ ! "$TAG" =~ ^([0-9]{2})\.([0-9]{2})\.([0-9]+)$ ]]; then
            echo "Expected version format: vYY.MM.PATCH"
            exit 1
          fi

          MONTH=$((10#${BASH_REMATCH[2]}))
          if (( MONTH < 1 || MONTH > 12 )); then
            echo "Month must be between 01 and 12"
            exit 1
          fi

          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "compatpy"))')

          if [[ "$TAG" != "$CARGO_VERSION" ]]; then
            echo "Tag ($TAG) does not match Cargo version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Verify package
        run: cargo publish --dry-run --locked

  create-draft-release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create or update draft release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"

          NOTES=$(awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)

          if [[ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]]; then
            echo "No changelog entry found for version $VERSION in CHANGELOG.md"
            exit 1
          fi

          API_URL="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG"

          HTTP_STATUS=$(curl --silent --show-error \
            --output release-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL")

          case "$HTTP_STATUS" in
            200)
              IS_DRAFT=$(jq -r '.draft' release-response.json)

              if [[ "$IS_DRAFT" != "true" ]]; then
                echo "Release $TAG is already published; refusing to modify it."
                exit 1
              fi

              gh release edit "$TAG" --notes "$NOTES"
              ;;
            404)
              gh release create "$TAG" \
                --draft \
                --title "$TAG" \
                --notes "$NOTES"
              ;;
            *)
              echo "GitHub API returned HTTP $HTTP_STATUS; refusing to modify releases."
              cat release-response.json
              exit 1
              ;;
          esac

          rm -f release-response.json

  upload-binaries:
    name: Build ${{ matrix.target }}
    needs: create-draft-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSSL and build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get update
            sudo dpkg --add-architecture arm64

            # Restrict existing Ubuntu mirror sources to amd64.
            sudo sed -i '/^Suites:/i Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources

            # Use Ubuntu Ports for ARM64 packages.
            sudo tee /etc/apt/sources.list.d/ubuntu-arm64-ports.list > /dev/null <<'EOF'
          deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports noble main universe restricted multiverse
          deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports noble-updates main universe restricted multiverse
          deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports noble-backports main universe restricted multiverse
          deb [arch=arm64] https://ports.ubuntu.com/ubuntu-ports noble-security main universe restricted multiverse
          EOF

            sudo apt-get update

            sudo apt-get install -y --no-install-recommends \
              libssl-dev:arm64 \
              pkg-config \
              gcc-aarch64-linux-gnu \
              libc6-dev-arm64-cross

            echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
            echo "OPENSSL_DIR=/usr" >> "$GITHUB_ENV"
            echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> "$GITHUB_ENV"
            echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              libssl-dev \
              pkg-config
          fi

      - name: Install stable Rust for ARM64 build
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Configure ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build Linux ARM64 binary
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build --release --bin compatpy --locked --target aarch64-unknown-linux-gnu

      - name: Package Linux ARM64 release
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release
          cp target/aarch64-unknown-linux-gnu/release/compatpy \
            release/compatpy-aarch64-unknown-linux-gnu
          cp LICENSE README.md release/

          cd release

          tar -czf compatpy-aarch64-unknown-linux-gnu.tar.gz \
            compatpy-aarch64-unknown-linux-gnu LICENSE README.md

          sha256sum compatpy-aarch64-unknown-linux-gnu \
            > compatpy-aarch64-unknown-linux-gnu.sha256

          sha256sum compatpy-aarch64-unknown-linux-gnu.tar.gz \
            > compatpy-aarch64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload Linux ARM64 release assets
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            release/compatpy-aarch64-unknown-linux-gnu \
            release/compatpy-aarch64-unknown-linux-gnu.sha256 \
            release/compatpy-aarch64-unknown-linux-gnu.tar.gz \
            release/compatpy-aarch64-unknown-linux-gnu.tar.gz.sha256 \
            --clobber

      - name: Build and upload portable binary
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: compatpy
          target: ${{ matrix.target }}
          ref: refs/tags/${{ github.ref_name }}
          token: ${{ github.token }}
          locked: true
          checksum: sha256
          include: LICENSE,README.md
        env:
          PKG_CONFIG_ALLOW_CROSS: "0"

  windows-msi:
    name: Build Windows MSI
    needs: create-draft-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset --yes --no-progress

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Initialize MSI configuration
        shell: powershell
        run: |
          if (!(Test-Path "wix/main.wxs")) {
            cargo wix init
          }

      - name: Build MSI
        run: cargo wix

      - name: Upload MSI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $msi = Get-ChildItem "target/wix" -Filter "*.msi" |
            Select-Object -First 1

          if (!$msi) {
            throw "No MSI was produced"
          }

          gh release upload "$env:TAG" "$($msi.FullName)" --clobber

  publish-crate:
    name: Publish to crates.io
    needs: [upload-binaries, windows-msi]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}


  publish-release:
    name: Publish GitHub Release
    needs: [upload-binaries, windows-msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for release tagged $TAG in $REPOSITORY"

          RELEASE_ID=$(gh api --paginate \
            "repos/$REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" \
            | head -n 1)

          if [[ -z "$RELEASE_ID" ]]; then
            echo "No GitHub release found for tag $TAG."
            echo "Available releases:"
            gh release list --repo "$REPOSITORY" || true
            exit 1
          fi

          echo "Publishing release ID $RELEASE_ID"

          gh api \
            --method PATCH \
            "repos/$REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false

          echo "Release $TAG is now published."
