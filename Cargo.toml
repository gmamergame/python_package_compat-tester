[package]
name = "compatpy"
version = "26.10.4"
edition = "2024"
rust-version = "1.85"
description = "Find Python versions compatible with a project's dependencies."
authors = ["oluxid"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/oluxid/CompatPy"
keywords = ["python", "compatibility", "dependencies", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["plan.md"]

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"
url = "2.5.8"
